

services:
  monitorix-backend:
    build: ./backend
    container_name: monitorix-backend
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=postgresql+asyncpg://sentinel_user:rVcDsUVYia5tsHefxFKTbPOl@db.monitorix.co.in:41892/monitorix
      - MONGO_URL=mongodb://root:LGfhcnMyhnUwA9owN5FnWdkV@db.monitorix.co.in:52741/monitorix?authSource=admin
      - HOST=0.0.0.0
      - CELERY_BROKER_URL=redis://db.monitorix.co.in:49103/0
      - CELERY_RESULT_BACKEND=redis://db.monitorix.co.in:49103/0
      - REDIS_URL=redis://db.monitorix.co.in:49103/0
      - CLICKHOUSE_URL=clickhouse://sentinel_user:sentinel_password@db.monitorix.co.in:58320/monitorix
      - SECRET_KEY=${SECRET_KEY}
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - PORT=8000
      # DMARC-aligned SMTP: must use from/sender within monitorix.co.in domain
      - SMTP_HOST=smtp.monitorix.co.in
      - SMTP_PORT=465
      - SMTP_USER=info@monitorix.co.in
      - SMTP_PASS=${SMTP_PASSWORD}
      - SMTP_FROM=info@monitorix.co.in
      - MONITORIX_BASE_URL=https://monitorix.co.in
    volumes:
      - ./backend/storage:/app/storage

  monitorix-celery:
    build: ./backend
    container_name: monitorix-celery
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=postgresql+asyncpg://sentinel_user:rVcDsUVYia5tsHefxFKTbPOl@db.monitorix.co.in:41892/monitorix
      - MONGO_URL=mongodb://root:LGfhcnMyhnUwA9owN5FnWdkV@db.monitorix.co.in:52741/monitorix?authSource=admin
      - CELERY_BROKER_URL=redis://db.monitorix.co.in:49103/0
      - CELERY_RESULT_BACKEND=redis://db.monitorix.co.in:49103/0
      - REDIS_URL=redis://db.monitorix.co.in:49103/0
      - CLICKHOUSE_URL=clickhouse://sentinel_user:sentinel_password@db.monitorix.co.in:58320/monitorix
      # DMARC-aligned SMTP: must use from/sender within monitorix.co.in domain
      - SMTP_HOST=smtp.monitorix.co.in
      - SMTP_PORT=465
      - SMTP_USER=info@monitorix.co.in
      - SMTP_PASS=${SMTP_PASSWORD}
      - SMTP_FROM=info@monitorix.co.in
      - MONITORIX_BASE_URL=https://monitorix.co.in
    volumes:
      - ./backend/storage:/app/storage

  monitorix-kafka-consumer:
    build: ./backend
    container_name: monitorix-kafka-consumer
    command: python -m app.workers.kafka_consumer
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=postgresql+asyncpg://sentinel_user:rVcDsUVYia5tsHefxFKTbPOl@db.monitorix.co.in:41892/monitorix
      - MONGO_URL=mongodb://root:LGfhcnMyhnUwA9owN5FnWdkV@db.monitorix.co.in:52741/monitorix?authSource=admin
      - CELERY_BROKER_URL=redis://db.monitorix.co.in:49103/0
      - CELERY_RESULT_BACKEND=redis://db.monitorix.co.in:49103/0
      - REDIS_URL=redis://db.monitorix.co.in:49103/0
      - CLICKHOUSE_URL=clickhouse://sentinel_user:sentinel_password@db.monitorix.co.in:58320/monitorix
      - KAFKA_BROKER_URL=db.monitorix.co.in:9092
      # DMARC-aligned SMTP: must use from/sender within monitorix.co.in domain
      - SMTP_HOST=smtp.monitorix.co.in
      - SMTP_PORT=465
      - SMTP_USER=info@monitorix.co.in
      - SMTP_PASS=${SMTP_PASSWORD}
      - SMTP_FROM=info@monitorix.co.in
      - MONITORIX_BASE_URL=https://monitorix.co.in
    volumes:
      - ./backend/storage:/app/storage

  monitorix-frontend:
    build: ../watch-sec-frontend
    container_name: monitorix-frontend
    ports:
      - "8080:80"
    depends_on:
      - monitorix-backend
