

services:
  monitorix-backend:
    build: ./backend
    container_name: monitorix-backend
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=
      - MONGO_URL=
      - HOST=0.0.0.0
      - CELERY_BROKER_URL=
      - CELERY_RESULT_BACKEND=
      - REDIS_URL=
      - CLICKHOUSE_URL=
      - SECRET_KEY=${SECRET_KEY}
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - PORT=8000
      # DMARC-aligned SMTP: must use from/sender within monitorix.co.in domain
      - SMTP_HOST=mail.monitorix.co.in
      - SMTP_PORT=587
      - SMTP_USER=rajasekhark@monitorix.co.in
      - SMTP_PASS=
      - SMTP_FROM=rajasekhark@monitorix.co.in
      - MONITORIX_BASE_URL=https://monitorix.co.in
    volumes:
      - ./backend/storage:/app/storage

  monitorix-celery:
    build: ./backend
    container_name: monitorix-celery
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=
      - MONGO_URL=
      - CELERY_BROKER_URL=
      - CELERY_RESULT_BACKEND=
      - REDIS_URL=
      - CLICKHOUSE_URL=
      # DMARC-aligned SMTP: must use from/sender within monitorix.co.in domain
      - SMTP_HOST=mail.monitorix.co.in
      - SMTP_PORT=587
      - SMTP_USER=rajasekhark@monitorix.co.in
      - SMTP_PASS=
      - SMTP_FROM=rajasekhark@monitorix.co.in
      - MONITORIX_BASE_URL=https://monitorix.co.in
    volumes:
      - ./backend/storage:/app/storage

  monitorix-celery-beat:
    build: ./backend
    container_name: monitorix-celery-beat
    command: celery -A app.core.celery_app.celery_app beat --loglevel=info --schedule /app/storage/celerybeat-schedule
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=
      - MONGO_URL=
      - CELERY_BROKER_URL=
      - CELERY_RESULT_BACKEND=
      - REDIS_URL=
      - CLICKHOUSE_URL=
      - MONITORIX_BASE_URL=https://monitorix.co.in
    volumes:
      - ./backend/storage:/app/storage

  monitorix-kafka-consumer:
    build: ./backend
    container_name: monitorix-kafka-consumer
    command: python -m app.workers.kafka_consumer
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=
      - MONGO_URL=
      - CELERY_BROKER_URL=
      - CELERY_RESULT_BACKEND=
      - REDIS_URL=
      - CLICKHOUSE_URL=
      - KAFKA_BROKER_URL=
      # DMARC-aligned SMTP: must use from/sender within monitorix.co.in domain
      - SMTP_HOST=mail.monitorix.co.in
      - SMTP_PORT=587
      - SMTP_USER=rajasekhark@monitorix.co.in
      - SMTP_PASS=
      - SMTP_FROM=rajasekhark@monitorix.co.in
      - MONITORIX_BASE_URL=https://monitorix.co.in
    volumes:
      - ./backend/storage:/app/storage

  monitorix-frontend:
    build: ../watch-sec-frontend
    container_name: monitorix-frontend
    ports:
      - "8080:80"
    depends_on:
      - monitorix-backend
