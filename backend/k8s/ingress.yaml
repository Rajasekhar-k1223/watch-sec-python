apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monitorix-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "monitorix-api"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - api.monitorix.co.in
    secretName: monitorix-api-tls
  rules:
  - host: api.monitorix.co.in
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: monitorix-api
            port:
              number: 80
