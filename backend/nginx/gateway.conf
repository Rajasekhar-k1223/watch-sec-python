# [v2.6.0] Monitorix Sovereign Gateway: Hardened for Global SaaS
# Handles SSL, mTLS, GeoIP Blocking, and Tenant Quotas

# Load GeoIP module (assuming nginx-mod-http-geoip is installed)
# geoip_country /usr/share/GeoIP/GeoIP.dat;

upstream monitorix_api {
    server 127.0.0.1:8000;
    keepalive 64;
}

# Advanced Rate Limiting
limit_req_zone $binary_remote_addr zone=api_limit:20m rate=20r/s;
limit_req_zone $http_x_tenant_id zone=tenant_limit:20m rate=100r/s;

# [NEW] SQL Injection & XSS Protection Snippet
map $request_uri $is_suspicious {
    default 0;
    "~*select|union|insert|update|delete|drop" 1;
    "~*<script|alert\(|javascript:" 1;
}

server {
    listen 443 ssl http2; # Enable HTTP/2 for performance
    server_name api.monitorix.enterprise;

    # SSL Hardening: TLS 1.3 ONLY for maximum security
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # [NEW] GeoIP Blocking: Only allow traffic from trusted regions (Example)
    # if ($geoip_country_code !~ (US|IN|GB|DE)) { return 403; }

    # [NEW] Block Suspicious Requests
    if ($is_suspicious) { return 400; }

    # Strict Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; object-src 'none';" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location /api/agent/ {
        limit_req zone=api_limit burst=10 nodelay;
        
        # Inject mTLS Subject into Backend
        proxy_set_header X-Client-Cert-Subject $ssl_client_s_dn;
        proxy_pass http://monitorix_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        limit_req zone=tenant_limit burst=50 nodelay;
        proxy_pass http://monitorix_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # [NEW] Response Compression
        gzip on;
        gzip_types application/json text/plain;
    }
}
