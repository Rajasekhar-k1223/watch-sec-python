services:
  backend:
    build: ./backend
    container_name: watch-sec-backend
    restart: unless-stopped
    command: uvicorn app.main_dashboard:app --host 0.0.0.0 --port 8000
    ports:
      - "8010:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://sentinel_user:rVcDsUVYia5tsHefxFKTbPOl@sentinel_postgres:5432/monitorix
      - MONGO_URL=mongodb://root:LGfhcnMyhnUwA9owN5FnWdkV@sentinel_mongodb:27017/monitorix?authSource=admin
      - REDIS_URL=redis://sentinel_redis:6379/0
      - CELERY_BROKER_URL=redis://sentinel_redis:6379/0
      - CELERY_RESULT_BACKEND=redis://sentinel_redis:6379/0
      - CLICKHOUSE_URL=clickhouse://sentinel_user:sentinel_password@sentinel_clickhouse:9000/monitorix
      - KAFKA_BROKER_URL=kafka:29092
      - PYTHONUNBUFFERED=1
      - MONITORIX_BASE_URL=https://monitorix.elsea.co.in
      - AGENT_BACKEND_URL=https://agent-apis.elsea.co.in
      - VAULT_MASTER_KEY=${VAULT_MASTER_KEY}
    volumes:
      - ./backend/storage:/app/storage
      - ./backend:/app
      - ../agent-rust:/opt/apps/monitorix/agent-rust
    networks:
      - watch-sec-network
      - shared-db-net

  agent-gateway:
    build: ./backend
    restart: unless-stopped
    command: uvicorn app.main_agent:app --host 0.0.0.0 --port 8005
    deploy:
      replicas: 3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://sentinel_user:rVcDsUVYia5tsHefxFKTbPOl@sentinel_postgres:5432/monitorix
      - MONGO_URL=mongodb://root:LGfhcnMyhnUwA9owN5FnWdkV@sentinel_mongodb:27017/monitorix?authSource=admin
      - REDIS_URL=redis://sentinel_redis:6379/0
      - CELERY_BROKER_URL=redis://sentinel_redis:6379/0
      - CELERY_RESULT_BACKEND=redis://sentinel_redis:6379/0
      - CLICKHOUSE_URL=clickhouse://sentinel_user:sentinel_password@sentinel_clickhouse:9000/monitorix
      - KAFKA_BROKER_URL=kafka:29092
      - PYTHONUNBUFFERED=1
      - MONITORIX_BASE_URL=https://monitorix.elsea.co.in
      - AGENT_BACKEND_URL=https://agent-apis.elsea.co.in
      - VAULT_MASTER_KEY=${VAULT_MASTER_KEY}
    volumes:
      - ./backend/storage:/app/storage
      - ./backend:/app
      - ../agent-rust:/opt/apps/monitorix/agent-rust
    networks:
      - watch-sec-network
      - shared-db-net

  grpc-gateway:
    build: ./backend
    container_name: watch-sec-grpc-gateway
    restart: unless-stopped
    command: python -m app.grpc_gateway
    ports:
      - "50051:50051"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://sentinel_user:rVcDsUVYia5tsHefxFKTbPOl@sentinel_postgres:5432/monitorix
      - MONGO_URL=mongodb://root:LGfhcnMyhnUwA9owN5FnWdkV@sentinel_mongodb:27017/monitorix?authSource=admin
      - REDIS_URL=redis://sentinel_redis:6379/0
      - CELERY_BROKER_URL=redis://sentinel_redis:6379/0
      - CELERY_RESULT_BACKEND=redis://sentinel_redis:6379/0
      - CLICKHOUSE_URL=clickhouse://sentinel_user:sentinel_password@sentinel_clickhouse:9000/monitorix
      - KAFKA_BROKER_URL=kafka:29092
      - PYTHONUNBUFFERED=1
      - MONITORIX_BASE_URL=https://monitorix.co.in
      - VAULT_MASTER_KEY=${VAULT_MASTER_KEY}
    volumes:
      - ./backend:/app
    networks:
      - watch-sec-network
      - shared-db-net

  load-balancer:
    image: nginx:alpine
    container_name: watch-sec-load-balancer
    restart: unless-stopped
    ports:
      - "8005:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - agent-gateway
    networks:
      - watch-sec-network
      - shared-db-net

  frontend:
    build:
      context: ../watch-sec-frontend
      args:
        VITE_API_URL: https://monitorix-apis.elsea.co.in/api
    container_name: watch-sec-frontend
    restart: unless-stopped
    ports:
      - "8085:80"
    networks:
      - watch-sec-network
      - shared-db-net

  celery:
    build: ./backend
    container_name: watch-sec-celery
    restart: unless-stopped
    command: celery -A app.worker.celery_app worker --loglevel=info
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://sentinel_user:rVcDsUVYia5tsHefxFKTbPOl@sentinel_postgres:5432/monitorix
      - MONGO_URL=mongodb://root:LGfhcnMyhnUwA9owN5FnWdkV@sentinel_mongodb:27017/monitorix?authSource=admin
      - REDIS_URL=redis://sentinel_redis:6379/0
      - CELERY_BROKER_URL=redis://sentinel_redis:6379/0
      - CELERY_RESULT_BACKEND=redis://sentinel_redis:6379/0
      - CLICKHOUSE_URL=clickhouse://sentinel_user:sentinel_password@sentinel_clickhouse:9000/monitorix
      - KAFKA_BROKER_URL=kafka:29092
      - MONITORIX_BASE_URL=https://monitorix.co.in
      - VAULT_MASTER_KEY=${VAULT_MASTER_KEY}
    volumes:
      - ./backend:/app
      - ./backend/storage:/app/storage

  kafka-consumer:
    build: ./backend
    container_name: watch-sec-kafka-consumer
    restart: unless-stopped
    command: python -m app.workers.kafka_consumer
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://sentinel_user:rVcDsUVYia5tsHefxFKTbPOl@sentinel_postgres:5432/monitorix
      - MONGO_URL=mongodb://root:LGfhcnMyhnUwA9owN5FnWdkV@sentinel_mongodb:27017/monitorix?authSource=admin
      - REDIS_URL=redis://sentinel_redis:6379/0
      - CELERY_BROKER_URL=redis://sentinel_redis:6379/0
      - CELERY_RESULT_BACKEND=redis://sentinel_redis:6379/0
      - CLICKHOUSE_URL=clickhouse://sentinel_user:sentinel_password@sentinel_clickhouse:9000/monitorix
      - KAFKA_BROKER_URL=kafka:29092
      - PYTHONUNBUFFERED=1
      - MONITORIX_BASE_URL=https://monitorix.co.in
      - VAULT_MASTER_KEY=${VAULT_MASTER_KEY}
    volumes:
      - ./backend:/app
    networks:
      - watch-sec-network
      - shared-db-net


  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.2
    container_name: watch-sec-zookeeper
    restart: unless-stopped
    environment:
      KAFKA_HEAP_OPTS: "-Xmx256M -Xms256M"
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - watch-sec-network
      - shared-db-net

  kafka:
    image: confluentinc/cp-kafka:7.3.2
    container_name: watch-sec-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M"
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - watch-sec-network
      - shared-db-net

networks:
  shared-db-net:
    external: true
  watch-sec-network:
    external: true

