events {
    worker_connections 1024;
}

stream {
    upstream grpc_cluster {
        server watch-sec-grpc-gateway-1:50051 max_fails=3 fail_timeout=5s;
        server watch-sec-grpc-gateway-2:50051 max_fails=3 fail_timeout=5s;
        server watch-sec-grpc-gateway-3:50051 max_fails=3 fail_timeout=5s;
    }

    server {
        listen 50051;
        proxy_pass grpc_cluster;
        proxy_next_upstream on;
        proxy_next_upstream_timeout 5s;
        proxy_next_upstream_tries 3;
        proxy_timeout 1h;
        proxy_connect_timeout 2s;
    }
}

http {
    # Use Docker's internal DNS resolver to dynamically resolve upstream replicas
    resolver 127.0.0.11 valid=5s;
    client_max_body_size 10G;

    server {
        listen 80;

        location / {
            # Use variable to force dynamic DNS resolution at runtime
            set $upstream http://agent-gateway:8005;
            proxy_pass $upstream;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        }

        location /socket.io/ {
            set $upstream http://agent-gateway:8005;
            proxy_pass $upstream;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
